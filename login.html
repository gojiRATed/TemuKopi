<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Login - TemuKopi</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Bootstrap Icon -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
  />

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body class="login-page">

  <!-- BACKGROUND -->
  <img
    src="asset/continent.kohi_.jpg"
    alt=""
    class="login-bg"
  >

  <div class="overlay"></div>

  <!-- LOGIN -->
  <div class="container login-wrapper d-flex align-items-center justify-content-center">

    <div class="login-box">

      <!-- LOGO -->
      <div class="text-center mb-4">

        <img
          src="asset/temukopi_logo.png"
          alt=""
          class="logo-login"
        >

      </div>

      <!-- TITLE -->
      <h1 class="title text-center">
        Welcome Back
      </h1>

      <p class="desc text-center mt-3 mb-5">
        Discover your favorite coffee spots.
      </p>

      <!-- FORM -->
      <form id="loginForm">

        <!-- EMAIL -->
        <div class="input-box mb-3">

          <i class="bi bi-envelope"></i>

          <input
            type="email"
            class="form-control"
            placeholder="Email Address"
            required
          >

        </div>

        <!-- PASSWORD -->
        <div class="input-box mb-4">

          <i class="bi bi-lock"></i>

          <input
            type="password"
            class="form-control"
            placeholder="Password"
            required
          >

        </div>

        <!-- OPTION -->
        <div class="d-flex justify-content-between align-items-center mb-4">

          <div class="form-check">

            <input
              class="form-check-input"
              type="checkbox"
              id="remember"
            >

            <label
              class="form-check-label text-light"
              for="remember"
            >
              Remember
            </label>

          </div>

          <a href="#" class="login-link">
            Forgot Password?
          </a>

        </div>

        <!-- BUTTON -->
        <button class="login-btn">
          Login
        </button>

      </form>

      <!-- DIVIDER -->
      <div class="divider my-4">
        or
      </div>

      <!-- GOOGLE -->
      <button class="google-btn d-flex align-items-center justify-content-center gap-3">

        <i class="bi bi-google"></i>

        Continue with Google

      </button>

      <!-- REGISTER -->
      <p class="text-center text-light mt-4">

        Don't have an account?

        <a href="#" class="login-link fw-bold">
          Register
        </a>

      </p>

    </div>

  </div>

  <!-- SCRIPT -->
  <script src="script.js"></script>

</body>
</html>
